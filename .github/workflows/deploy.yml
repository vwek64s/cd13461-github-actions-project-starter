name: Deploy Knowledge Base

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSE.txt"

  pull_request:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "LICENSE.txt"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: deploy-knowledge-base
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Setup npm 9
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run linters
        run: npm run lint:all

      - name: Run URL checker
        run: node script/url-checker.js -t "${{ vars.URL_CHECKER_TIMEOUT }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Use npm 9
        run: npm install -g npm@9

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build static site
        run: |
          REPOSITORY_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2-)
          PATH_PREFIX="/${REPOSITORY_NAME}/" npm run prod

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - test
      - build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Create deployment status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          DEPLOY_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          TODAY=$(date +%F)

          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            STATUS="succeeded"
          else
            STATUS="failed"
          fi

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "$TODAY - Deployment: $STATUS" \
            --body "URL: $DEPLOY_URL"
